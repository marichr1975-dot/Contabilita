name: Crea app iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/crea-ipa.yml"

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica progetto
        run: |
          set -e
          test -d ios/Contabilita.xcodeproj
          test -f ios/Contabilita/App.swift
          test -f ios/Contabilita/ContentView.swift
          echo "Progetto iOS trovato."

      - name: Compila progetto iOS
        run: |
          set -e
          xcodebuild \
            -project ios/Contabilita.xcodeproj \
            -scheme Contabilita \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Crea IPA non firmata
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Contabilita-unsigned.ipa Payload
          rm -rf Payload

      - name: Carica IPA
        uses: actions/upload-artifact@v4
        with:
          name: Contabilita-IPA
          path: Contabilita-unsigned.ipa
