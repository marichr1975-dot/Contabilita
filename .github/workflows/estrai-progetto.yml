name: Crea app iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/crea-ipa.yml"

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica progetto
        run: |
          echo "Controllo progetto iOS..."
          if [ ! -d "ios" ]; then
            echo "ERRORE: cartella ios non trovata."
            exit 1
          fi
          find ios -maxdepth 2 -type f | head -50

      - name: Installa CocoaPods
        run: |
          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install
          fi

      - name: Compila progetto iOS
        run: |
          set -e
          if [ -d "ios/Contabilita.xcworkspace" ]; then
            xcodebuild               -workspace ios/Contabilita.xcworkspace               -scheme Contabilita               -configuration Release               -sdk iphoneos               -derivedDataPath build               CODE_SIGNING_ALLOWED=NO               CODE_SIGNING_REQUIRED=NO               build
          elif [ -d "ios/Contabilita.xcodeproj" ]; then
            xcodebuild               -project ios/Contabilita.xcodeproj               -scheme Contabilita               -configuration Release               -sdk iphoneos               -derivedDataPath build               CODE_SIGNING_ALLOWED=NO               CODE_SIGNING_REQUIRED=NO               build
          else
            echo "ERRORE: progetto Contabilita.xcodeproj/.xcworkspace non trovato."
            exit 1
          fi

      - name: Crea IPA non firmata
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "ERRORE: .app non trovata."
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Contabilita-unsigned.ipa Payload
          rm -rf Payload

      - name: Carica IPA come artifact
        uses: actions/upload-artifact@v4
        with:
          name: Contabilita-IPA
          path: Contabilita-unsigned.ipa
